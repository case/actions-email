name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only PRs share a group, so pushes to main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # A single quote breaks out of the quoting that run: splicing would rely on
    env:
      HOSTILE_SUBJECT: x'$(touch pwned)'y "quoted" `touch pwned` ::warning::subject
      HOSTILE_BODY: "line one & $(touch pwned)\nline two 'quoted' ::warning::body ünï"
      EMAIL_FROM: sender@example.com
      EMAIL_TO: recipient@example.com
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools from mise.toml
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          # Newest mise release at least 14 days old, matching renovate.json's minimumReleaseAge
          minimum_release_age: 14d

      - name: Run bin/ci
        run: bin/ci

      # The action's own wiring is the one thing bin/test cannot reach
      - name: Load the stub urlopen
        run: test/use-stub-provider

      - name: Run the action with hostile inputs
        uses: ./
        env:
          RESEND_API_KEY: re_stub
        with:
          provider: resend
          subject: ${{ env.HOSTILE_SUBJECT }}
          body_html: ${{ env.HOSTILE_BODY }}
          body_text: ${{ env.HOSTILE_BODY }}

      - name: Check what the action sent
        run: test/check-action-call
